[package]
name = "wormforge-weapon-studio"
version = "1.0.0"
description = "WormForge Weapon Studio (API 4.0)"
authors = ["LucianoWorms"]
edition = "2021"
default-run = "wormforge-weapon-studio"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
